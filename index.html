<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeOrbit · Learn DSA in Python</title>
<style>
:root{
  --bg:#1A1A1A; --p:#212121; --p2:#2A2A2A; --bd:#333333;
  --tx:#FFFFFF; --mu:#A0A0A0;
  --a:#FFA116; --a2:#FF8C00;
  --ok:#2CBB5D; --wa:#FFA116; --er:#EF4743; --info:#3B82F6;
  --r:12px;
}
[data-t=light]{
  --bg:#F7F7F7; --p:#FFFFFF; --p2:#EFEFEF; --bd:#DEDEDE;
  --tx:#1A1A1A; --mu:#6A6A6A;
  --a:#E68A00; --a2:#D97706;
  --ok:#229B4A; --wa:#E68A00; --er:#D63A36; --info:#2563EB;
}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--info);text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--p) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:19px;text-decoration:none;color:var(--tx);white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand b{color:var(--a)}
.btn{background:var(--p2);border:1px solid var(--bd);padding:7px 12px;border-radius:9px;transition:.15s;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn:hover{border-color:var(--a);transform:translateY(-1px)}
.btn.pri{background:var(--a);color:#1A1A1A;border-color:var(--a);font-weight:700}
.btn.pri:hover{background:var(--a2)}
.btn.on{border-color:var(--a);color:var(--a)}
.btn.ghost{background:transparent}
#sw{position:relative;flex:1;max-width:460px;margin:0 auto}
#q{width:100%;padding:8px 12px 8px 34px;border-radius:9px;border:1px solid var(--bd);background:var(--p2);color:var(--tx);outline:none}
#q:focus{border-color:var(--a)}
#sw .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
#res{position:absolute;top:110%;left:0;right:0;background:var(--p);border:1px solid var(--bd);border-radius:10px;max-height:60vh;overflow:auto;display:none;box-shadow:0 12px 30px #0008}
#res a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;color:var(--tx);text-decoration:none;border-bottom:1px solid var(--bd);align-items:center}
#res a:last-child{border-bottom:none}
#res a:hover{background:var(--p2)}
#res small{color:var(--mu)}
#menu{display:none}
.wrap{display:flex;min-height:calc(100vh - 57px)}
aside{width:280px;flex:none;border-right:1px solid var(--bd);padding:12px;overflow:auto;position:sticky;top:57px;height:calc(100vh - 57px);background:var(--p)}
aside details{margin-bottom:6px}
aside summary{cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:6px 4px;display:flex;align-items:center;gap:6px}
aside a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px;gap:8px;align-items:center}
aside a:hover{background:var(--p2)}
aside a.cur{background:var(--p2);color:var(--a);font-weight:600}
aside a small{color:var(--mu);font-variant-numeric:tabular-nums}
aside a.full small{color:var(--ok)}
main{flex:1;min-width:0;padding:24px clamp(14px,3vw,40px);max-width:1100px;margin:0 auto;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{font-size:clamp(24px,4vw,34px);margin-bottom:6px;letter-spacing:-.02em}
h2{margin:22px 0 10px;letter-spacing:-.01em}
h3{margin:8px 0 4px}
.mu{color:var(--mu)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--p),var(--p2));border:1px solid var(--bd);border-radius:18px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(var(--a),transparent 70%);opacity:.18}
.ring{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--a) calc(var(--v)*1%),var(--bd) 0)}
.ring div{width:100px;height:100px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:800;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;flex:1;min-width:260px;position:relative}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:24px;color:var(--a);display:flex;align-items:center;gap:6px}
.stat span{font-size:12px;color:var(--mu)}
.card{background:var(--p);border:1px solid var(--bd);border-radius:var(--r);padding:14px;transition:.18s;text-decoration:none;color:var(--tx);display:block}
a.card:hover{border-color:var(--a);transform:translateY(-3px);box-shadow:0 8px 24px #0006}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--p);font-size:13px;color:var(--tx)}
.chip.on{background:var(--a);color:#1A1A1A;border-color:var(--a);font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:6px;white-space:nowrap}
.Easy{color:var(--ok);border-color:var(--ok)}
.Medium{color:var(--wa);border-color:var(--wa)}
.Hard{color:var(--er);border-color:var(--er)}
.lcbadge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--p2);color:var(--a);border:1px solid var(--bd);margin-left:6px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--p);border:1px solid var(--bd);border-radius:var(--r);text-decoration:none;color:var(--tx);transition:.15s}
.row:hover{border-color:var(--a);transform:translateX(3px)}
.row .n{font-family:ui-monospace,monospace;color:var(--mu);width:34px;flex:none}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .t{opacity:.55;text-decoration:line-through}
.ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);display:grid;place-items:center;font-size:13px;flex:none}
.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.body{background:var(--p);border:1px solid var(--bd);border-radius:var(--r);padding:8px 22px 18px;overflow:auto}
.body h1,.body h2,.body h3{margin:18px 0 8px}
.body p,.body li{margin:6px 0}
.body ul,.body ol{padding-left:24px}
.body code{background:var(--p2);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
.body table{border-collapse:collapse;margin:10px 0;display:block;overflow:auto}
.body td,.body th{border:1px solid var(--bd);padding:6px 10px}
.body blockquote{border-left:3px solid var(--a);padding:2px 12px;color:var(--mu);margin:8px 0}
.cb{margin:12px 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#0F0F0F}
[data-t=light] .cb{background:#1E1E1E}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#1A1A1A;color:#A0A0A0;font-size:12px}
.cbh button{background:none;border:1px solid #333;border-radius:6px;padding:2px 8px;color:#ddd}
.cb pre{padding:12px 14px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#E6E6E6}
.cb code{background:none!important;padding:0!important}
.k{color:#C792EA}.s{color:#A5E075}.n2{color:#F78C6C}.c{color:#6B7794;font-style:italic}.f{color:#82AAFF}
.lock{text-align:center;padding:40px 10px}
.lock p{margin:8px 0 16px;color:var(--mu)}
textarea{width:100%;min-height:90px;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--a)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0;flex-wrap:wrap}
.ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--a);color:#1A1A1A;padding:9px 18px;border-radius:99px;font-weight:700;transition:.3s;z-index:50;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #0008}
#toast.s{transform:translate(-50%,0)}
.err{padding:30px;text-align:center;border:1px dashed var(--er);border-radius:var(--r)}
.load{padding:50px;text-align:center;color:var(--mu)}
.load:before{content:"";display:block;width:34px;height:34px;margin:0 auto 12px;border:3px solid var(--bd);border-top-color:var(--a);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow-x:auto;padding:6px 0}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--p2);border:1px solid var(--bd)}
.heat i.l1{background:#4a3714;border-color:#5a4318}
.heat i.l2{background:#8f6110;border-color:#a06f12}
.heat i.l3{background:#d18a0f;border-color:#e69810}
.heat i.l4{background:var(--a);border-color:var(--a)}
[data-t=light] .heat i.l1{background:#ffe6bf;border-color:#f5d29b}
[data-t=light] .heat i.l2{background:#ffcb7a;border-color:#f5b95c}
[data-t=light] .heat i.l3{background:#ffb03d;border-color:#e89b2a}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu);margin-top:6px}

/* Stat bars */
.sbar{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.sbar .bar{margin:0}

/* Modal */
.modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:20px}
.modal.open{display:grid}
.modal .box{background:var(--p);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 20px 60px #000a}
.modal h2{margin-top:0}
.kbd{display:inline-block;background:var(--p2);border:1px solid var(--bd);border-bottom-width:2px;padding:1px 7px;border-radius:6px;font:12px ui-monospace,monospace;color:var(--tx)}
.krow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);align-items:center;gap:12px}
.krow:last-child{border-bottom:none}

/* Confetti */
.confetti{position:fixed;left:50%;top:55%;width:0;height:0;pointer-events:none;z-index:100}
.confetti svg{position:absolute;width:10px;height:10px;animation:cf 1.25s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* Revision pill */
.rev{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 45%,transparent)}
.timerbox{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.timerbox button{background:none;border:none;padding:2px;color:var(--mu);border-radius:6px}
.timerbox button:hover{color:var(--a)}

@media(max-width:820px){
  #menu{display:inline-flex}
  aside{position:fixed;left:0;top:57px;z-index:15;transform:translateX(-100%);transition:.25s;width:280px}
  aside.open{transform:none}
  .brand span{display:none}
  main{padding:18px 14px}
  .sbar{grid-template-columns:70px 1fr 60px}
}
</style>
</head>

  <button class="btn" id="menu" aria-label="Menu"></button>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

const KW=/^(def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|with|try|except|finally|raise|yield|lambda|pass|break|continue|None|True|False|self|global|nonlocal|assert|del|async|await)$/;
function hl(c){
 let o='',l=0,m,p='';
 const R=/(#.*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)/g;
 while(m=R.exec(c)){
  o+=esc(c.slice(l,m.index));l=R.lastIndex;
  o+=m[1]?`<span class=c>${esc(m[1])}</span>`
   :m[2]?`<span class=s>${esc(m[2])}</span>`
   :m[3]?`<span class=n2>${m[3]}</span>`
   :KW.test(m[4])?`<span class=k>${m[4]}</span>`
   :(/^\s*\(/.test(c.slice(l,l+3))&&p!='.'?`<span class=f>${m[4]}</span>`:m[4]);
  p=m[0];
 }
 return o+esc(c.slice(l));
}
const cb=(c,l)=>`<div class=cb><div class=cbh><span>${esc(l||'code')}</span><button data-copy>Copy</button></div><pre><code>${hl(c.replace(/\n$/,''))}</code></pre></div>`;

function md(src){
 const B=[];
 src=src.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>(B.push(cb(c,l)),'\0'+(B.length-1)+'\0'));
 src=esc(src);
 const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target=_blank rel=noopener>$1</a>');
 const L=src.split('\n');let o='',lst=null,P=[];
 const fp=()=>{if(P.length){o+='<p>'+inl(P.join(' '))+'</p>';P=[]}};
 const fl=()=>{if(lst){o+='</'+lst+'>';lst=null}};
 for(let i=0;i<L.length;i++){
  const l=L[i];let m;
  if(m=l.match(/^\0(\d+)\0$/)){fp();fl();o+=B[m[1]]}
  else if(m=l.match(/^(#{1,6})\s+(.*)/)){fp();fl();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if(/^\s*\|.*\|\s*$/.test(l)){
   fp();fl();let r=[];
   while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))r.push(L[i++]);i--;
   o+='<table>'+r.filter(x=>!/^[\s|:-]+$/.test(x)).map((x,j)=>'<tr>'+x.trim().replace(/^\||\|$/g,'').split('|').map(c=>`<t${j?'d':'h'}>${inl(c.trim())}</t${j?'d':'h'}>`).join('')+'</tr>').join('')+'</table>';
  }
  else if(m=l.match(/^\s*([-*]|\d+\.)\s+(.*)/)){
   fp();const t=/\d/.test(m[1])?'ol':'ul';
   if(lst!=t){fl();o+='<'+t+'>';lst=t}
   o+='<li>'+inl(m[2])+'</li>';
  }
  else if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){fp();fl();o+='<hr>'}
  else if(m=l.match(/^&gt;\s?(.*)/)){fp();fl();o+='<blockquote>'+inl(m[1])+'</blockquote>'}
  else if(!l.trim()){fp();fl()}
  else P.push(l.trim());
 }
 fp();fl();return o;
}
const render=(txt,path)=>/\.py$/.test(path)?cb(txt,'python'):md(txt);

async function load(){
 let c=ls.get('co_tree',null),tree;
 if(c&&Date.now()-c.t<216e5)tree=c.d;
 else try{
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
  if(!r.ok)throw 0;
  tree=(await r.json()).tree
   .filter(x=>x.type=='blob'&&x.path.includes('/')&&!x.path.startsWith('.')&&/\.(md|py|txt)$/.test(x.path))
   .map(x=>x.path);
  ls.set('co_tree',{t:Date.now(),d:tree});
 }catch{if(c)tree=c.d;else throw 0}
 const map={};
 for(const p of tree){
  const parts=p.split('/'),d=parts[0],f=parts.at(-1),base=f.replace(/\.\w+$/,'');
  const isSol=/solution/i.test(p);
  const m=base.match(/(\d+)(?!.*\d)/);
  const key=m?String(+m[1]):base.replace(/solution|problem|[_-]/gi,'').toLowerCase()||base;
  const T=map[d]??={dir:d,name:pretty(d),cat:cat(d),m:{}};
  const it=T.m[key]??={key,n:m?+m[1]:0};
  if(isSol)it.sol=p;else it.prob=p;
 }
 topics=Object.values(map).map(t=>({...t,items:Object.values(t.m).sort((a,b)=>a.n-b.n||a.key.localeCompare(b.key))})).filter(t=>t.items.length);
 const order=Object.values(CATS).flat();
 topics.sort((a,b)=>{const x=order.indexOf(a.dir),y=order.indexOf(b.dir);return(x<0?99:x)-(y<0?99:y)});
}

/* ============ Topic view ============ */
function topicView(d){
 const t=topics.find(x=>x.dir==d);if(!t)return home();
 const dn=doneIn(t);
 M.innerHTML=`
 <a href="#/" class=mu>${ICO.arrL} All topics</a>
 <div class=ph>
  <div><h1>${esc(t.name)}</h1><span class=mu>${esc(t.cat)} · ${dn}/${t.items.length} solved</span></div>
  <div><select id=fl class=btn>
    <option value=all>All</option><option value=todo>Unsolved</option>
    <option value=done>Solved</option><option value=bm>Bookmarked</option>
    <option value=rev>Due revision</option>
  </select></div>
 </div>
 <div class=bar style="margin:12px 0 18px"><i style="width:${t.items.length?dn/t.items.length*100:0}%"></i></div>
 <div class=list id=ls></div>`;

 const draw=()=>{
  const f=$('#fl').value,now=Date.now();
  $('#ls').innerHTML=t.items.filter(i=>{
   const k=id(t,i);
   return f=='all'||(f=='todo'&&!S.done[k])||(f=='done'&&S.done[k])||(f=='bm'&&S.bm[k])||(f=='rev'&&S.rev[k]&&S.rev[k]<=now);
  }).map(i=>{
   const k=id(t,i),ti=titles[k],lc=ti?.lc;
   return`<a class="row ${S.done[k]?'done':''}" href="${hash(t,i)}">
    <span class=ck>${S.done[k]?ICO.check:''}</span>
    <span class=n>${pad(i.n)}</span>
    <span class=t>${ti?esc(ti.t):'Problem '+pad(i.n)}</span>
    ${lc?`<span class=lcbadge>LC ${lc.n}</span>`:''}
    ${ti&&ti.d?`<span class="tag ${ti.d}">${ti.d}</span>`:''}
    ${S.bm[k]?`<span style="color:var(--a)">${ICO.starF}</span>`:''}
   </a>`}).join('')||'<p class=mu>Nothing here yet.</p>';
 };
 $('#fl').onchange=draw;draw();

 (async()=>{
  let ch=0;
  await Promise.all(t.items.filter(i=>i.prob&&!titles[id(t,i)]).map(async i=>{
   try{
    const x=await get(i.prob);
    const h=x.match(/^#+\s*(.+)/m);
    const title=(h?h[1]:'Problem '+pad(i.n)).replace(/\*|`/g,'').slice(0,90);
    titles[id(t,i)]={t:title,d:diffOf(x.slice(0,900)),lc:leetOf(title)};
    ch=1;
   }catch{}
  }));
  if(ch){ls.set('co_titles',titles);if(location.hash.startsWith('#/t/'))draw()}
 })();
}

/* ============ Problem view ============ */
async function probView(d,k){
 const t=topics.find(x=>x.dir==d);
 const ix=t?t.items.findIndex(x=>x.key==k):-1;
 if(ix<0)return home();
 const it=t.items[ix],K=id(t,it),pv=t.items[ix-1],nx=t.items[ix+1];
 S.recent=[K,...S.recent.filter(x=>x!=K)].slice(0,8);save();

 let shown=false,tab='p',sec=0,running=true;
 const ti=titles[K]||{},lc=ti.lc;

 M.innerHTML=`
 <a href="#/t/${encodeURIComponent(d)}" class=mu>${ICO.arrL} ${esc(t.name)}</a>
 <div class=ph>
  <div>
   <h1 id=ti>${esc(ti.t||('Problem '+pad(it.n)))}</h1>
   <div class=mu style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px">
    <span>${esc(t.name)} · #${pad(it.n)}</span>
    ${lc?`<span class="tag ${lc.d}">${lc.d}</span>`:''}
    <span class=timerbox>
      ${ICO.clock} <b id=tm>00:00</b>
      <button id=tt title="Pause">${ICO.pause}</button>
      <button id=tr title="Reset">${ICO.reset}</button>
    </span>
   </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   ${lc?`<a class="btn pri" target=_blank rel=noopener href="https://leetcode.com/problems/${lc.s}/">${ICO.lt} LeetCode #${lc.n}</a>`:''}
   <button class=btn id=bk></button>
   <button class=btn id=dn></button>
  </div>
 </div>
 <div class=tabs>
  <button class="btn on" id=t1>${ICO.book} Problem</button>
  <button class=btn id=t2>${ICO.bulb} Solution</button>
  ${lc?`<a class=btn target=_blank rel=noopener href="https://leetcode.com/problems/${lc.s}/">${ICO.ext} Open on LeetCode</a>`:''}
  <a class=btn target=_blank rel=noopener href="https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encodeURI(it.prob||it.sol)}">${ICO.ext} GitHub</a>
  <button class=btn id=cl title="Copy problem link">${ICO.code} Copy link</button>
 </div>
 <div class=body id=bd><div class=load>Loading…</div></div>

 <h2>${ICO.pencil} My notes</h2>
 <textarea id=nt placeholder="Approach, edge cases, time/space complexity…">${esc(S.notes[K]||'')}</textarea>

 <div class=nav>
  ${pv?`<a class=btn href="${hash(t,pv)}">${ICO.arrL} Previous</a>`:'<span></span>'}
  ${nx?`<a class="btn pri" href="${hash(t,nx)}">Next ${ICO.arrR}</a>`:'<span></span>'}
 </div>`;

 const st=()=>{
  $('#bk').innerHTML=(S.bm[K]?ICO.starF:ICO.star)+' '+(S.bm[K]?'Bookmarked':'Bookmark');
  $('#bk').classList.toggle('on',!!S.bm[K]);
  $('#dn').innerHTML=(S.done[K]?ICO.check:ICO.target)+' '+(S.done[K]?'Solved':'Mark solved');
  $('#dn').classList.toggle('pri',!!S.done[K]);
 };
 st();

 // Timer
 const tick=()=>{const e=$('#tm');if(!e)return;e.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60)};
 clearInterval(timer);timer=setInterval(()=>{if(running){sec++;tick()}},1000);
 $('#tt').onclick=()=>{running=!running;$('#tt').innerHTML=running?ICO.pause:ICO.play};
 $('#tr').onclick=()=>{sec=0;tick()};
 window.tg=()=>$('#dn').click();
 window.ts=()=>$('#t2').click();
 window.tp=()=>$('#tt').click();

 $('#bk').onclick=()=>{S.bm[K]?delete S.bm[K]:S.bm[K]=1;save();st()};
 $('#dn').onclick=()=>{
  if(S.done[K]){delete S.done[K]}
  else{markSolved(K,d);toast('Problem solved!');confetti()}
  save();st();side(d);
 };
 $('#nt').oninput=e=>{S.notes[K]=e.target.value;save()};
 $('#cl').onclick=()=>{
  navigator.clipboard.writeText(location.href);
  toast('Link copied',ICO.check);
 };

 const show=async()=>{
  const b=$('#bd');
  $('#t1').classList.toggle('on',tab=='p');
  $('#t2').classList.toggle('on',tab=='s');
  try{
   if(tab=='p'){
    const p=it.prob||it.sol;
    const x=await get(p);
    b.innerHTML=render(x,p);
    const h=x.match(/^#+\s*(.+)/m);
    if(h&&!titles[K]){
     const title=h[1].replace(/\*|`/g,'');
     titles[K]={t:title,d:diffOf(x.slice(0,900)),lc:leetOf(title)};
     ls.set('co_titles',titles);
     $('#ti').textContent=title;
    }
   }
   else if(!it.sol){b.innerHTML='<div class=lock><p>No separate solution file found for this problem.</p></div>'}
   else if(!shown){
    b.innerHTML=`<div class=lock>
      <h2>${ICO.lock} Try it yourself first</h2>
      <p>Spend at least a few minutes thinking — struggling is how you learn.</p>
      <button class="btn" id=hint>${ICO.bulb} Show hint</button>
      <button class="btn pri" id=rv>${ICO.bulb} Reveal solution</button>
    </div>`;
    $('#rv').onclick=()=>{shown=true;show()};
    $('#hint').onclick=async()=>{
     try{
      const sol=await get(it.sol);
      const first=sol.split('\n').filter(l=>l.trim()).slice(0,4).join('\n');
      $('#hint').insertAdjacentHTML('afterend','<div class=body style="margin-top:16px;text-align:left">'+md(first)+'</div>');
      $('#hint').disabled=true;
     }catch{}
    };
   }
   else b.innerHTML=render(await get(it.sol),it.sol);
  }catch{
   b.innerHTML=`<div class=err>Couldn't load this file.<br><a href="https://github.com/${OWNER}/${REPO}" target=_blank>Open the repo</a></div>`;
  }
 };
 $('#t1').onclick=()=>{tab='p';show()};
 $('#t2').onclick=()=>{tab='s';show()};
 show();
}

/* ============ Bookmarks view ============ */
function bmView(){
 const B=all().filter(x=>S.bm[x.id]);
 const R=S.recent.map(r=>all().find(x=>x.id==r)).filter(Boolean);
 const row=x=>{
  const ti=titles[x.id]||{};
  return`<a class="row ${S.done[x.id]?'done':''}" href="${hash(x.t,x.i)}">
   <span class=ck>${S.done[x.id]?ICO.check:''}</span>
   <span class=n>${pad(x.i.n)}</span>
   <span class=t>${esc(x.t.name)} — ${esc(ti.t||('Problem '+pad(x.i.n)))}</span>
   ${ti.lc?`<span class=lcbadge>LC ${ti.lc.n}</span>`:''}
  </a>`};
 M.innerHTML=`<h1>${ICO.starF} Bookmarks</h1>
  <div class=list>${B.map(row).join('')||'<p class=mu>Nothing bookmarked yet.</p>'}</div>
  <h2>${ICO.clock} Recently viewed</h2>
  <div class=list>${R.map(row).join('')||'<p class=mu>Nothing yet.</p>'}</div>`;
}

/* ============ Stats view ============ */
function statsView(){
 const A=all(),D=A.filter(x=>S.done[x.id]).length;
 const byDiff={Easy:0,Medium:0,Hard:0};
 for(const x of A){const ti=titles[x.id];if(S.done[x.id]&&ti?.d&&byDiff[ti.d]!=null)byDiff[ti.d]++}
 const due=revisionDue().length;

 // Heatmap: last 13 weeks
 const weeks=13,days=7,total=weeks*days;
 const start=new Date();start.setHours(0,0,0,0);
 start.setDate(start.getDate()-(total-1)-((start.getDay()+6)%7));
 const cells=[];
 const maxA=Math.max(1,...Object.values(S.act));
 for(let i=0;i<total;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const c=S.act[dstr(d)]||0;
  const lv=c==0?0:c<=maxA*0.25?1:c<=maxA*0.5?2:c<=maxA*0.75?3:4;
  cells.push(`<i class="l${lv}" title="${dstr(d)}: ${c} solved"></i>`);
 }

 const topicRows=topics.map(t=>{
  const d=doneIn(t),p=t.items.length?Math.round(d/t.items.length*100):0;
  return`<div class=sbar><span>${esc(t.name)}</span><div class=bar><i style="width:${p}%"></i></div><span class=mu style="text-align:right">${d}/${t.items.length}</span></div>`;
 }).filter(r=>r).join('');

 M.innerHTML=`
 <a href="#/" class=mu>${ICO.arrL} Home</a>
 <h1>${ICO.chart} Statistics</h1>
 <div class=stats style="margin-bottom:18px">
  <div class=stat><b>${D}</b><span>Problems solved</span></div>
  <div class=stat><b>${byDiff.Easy}</b><span style="color:var(--ok)">Easy</span></div>
  <div class=stat><b>${byDiff.Medium}</b><span style="color:var(--wa)">Medium</span></div>
  <div class=stat><b>${byDiff.Hard}</b><span style="color:var(--er)">Hard</span></div>
  <div class=stat><b>${ICO.flame} ${streak()}</b><span>Day streak</span></div>
  <div class=stat><b>${due}</b><span>Revision due</span></div>
 </div>

 <h2>Activity (last ${weeks} weeks)</h2>
 <div class=card>
  <div class=heat>${cells.join('')}</div>
  <div class=legend>Less <i style="width:12px;height:12px;border-radius:3px;background:var(--p2);border:1px solid var(--bd);display:inline-block"></i>
   <i style="width:12px;height:12px;border-radius:3px;background:#8f6110;display:inline-block"></i>
   <i style="width:12px;height:12px;border-radius:3px;background:#d18a0f;display:inline-block"></i>
   <i style="width:12px;height:12px;border-radius:3px;background:var(--a);display:inline-block"></i> More</div>
 </div>

 <h2>Topic progress</h2>
 <div class=card>${topicRows}</div>`;
}

/* ============ Keyboard modal ============ */
function shortcuts(){
 $('#mbox').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
   <h2 style="margin:0">${ICO.kbd} Keyboard shortcuts</h2>
   <button class=btn id=mc>${ICO.x}</button>
  </div>
  ${[
   ['/', 'Focus search'],
   ['r', 'Random problem'],
   ['d', 'Toggle solved (problem view)'],
   ['s', 'Show solution (problem view)'],
   ['p', 'Pause / resume timer'],
   ['j / k', 'Next / previous problem'],
   ['b', 'Bookmarks page'],
   ['g', 'Statistics page'],
   ['t', 'Toggle theme'],
   ['?', 'This help'],
   ['Esc', 'Close dialogs / blur']
  ].map(([k,v])=>`<div class=krow><span class=kbd>${k}</span><span class=mu>${v}</span></div>`).join('')}`;
 $('#modal').classList.add('open');
 $('#mc').onclick=closeModal;
}
const closeModal=()=>$('#modal').classList.remove('open');
$('#modal').onclick=e=>{if(e.target.id=='modal')closeModal()};

/* ============ Random ============ */
function rand(){
 const A=all(),U=A.filter(x=>!S.done[x.id]),P=U.length?U:A;
 const x=P[Math.random()*P.length|0];location.hash=hash(x.t,x.i);
}

/* ============ Router & events ============ */
function route(){
 clearInterval(timer);window.tg=window.ts=window.tp=null;
 const h=location.hash.slice(2).split('/').map(decodeURIComponent);
 side(h[0]=='t'||h[0]=='p'?h[1]:'');
 ({t:()=>topicView(h[1]),p:()=>probView(h[1],h[2]),bm:bmView,stats:statsView}[h[0]]||home)();
 scrollTo(0,0);$('#side').classList.remove('open');
}
addEventListener('hashchange',route);
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#th').onclick=()=>{S.theme=S.theme=='dark'?'light':'dark';document.documentElement.dataset.t=S.theme;save()};
$('#rnd').onclick=rand;
$('#stats').onclick=()=>location.hash='#/stats';
$('#ks').onclick=shortcuts;

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-copy]');
 if(b){
  navigator.clipboard.writeText(b.closest('.cb').querySelector('pre').textContent);
  b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);
 }
 if(!e.target.closest('#sw'))$('#res').style.display='none';
});

$('#q').oninput=e=>{
 const v=e.target.value.trim().toLowerCase(),r=$('#res');
 if(!v){r.style.display='none';return}
 const tr=topics.filter(t=>t.name.toLowerCase().includes(v)).slice(0,5)
  .map(t=>`<a href="#/t/${encodeURIComponent(t.dir)}"><span>${ICO.folder} ${esc(t.name)}</span><small>${t.items.length} problems</small></a>`);
 const pr=all().filter(x=>
   ((titles[x.id]||{}).t||'').toLowerCase().includes(v)||(x.t.name+' '+x.i.n).toLowerCase().includes(v)
  ).slice(0,10).map(x=>{
   const ti=titles[x.id]||{};
   return`<a href="${hash(x.t,x.i)}"><span>${esc(ti.t||('Problem '+pad(x.i.n)))}${ti.lc?` <span class=lcbadge>LC ${ti.lc.n}</span>`:''}</span><small>${esc(x.t.name)}</small></a>`;
  });
 r.innerHTML=[...tr,...pr].join('')||'<a><span class=mu>No matches (titles load as you browse topics)</span></a>';
 r.style.display='block';
};
$('#q').onkeydown=e=>{if(e.key=='Enter'){const a=$('#res a');if(a&&a.href){location.href=a.href;$('#res').style.display='none';e.target.blur()}}};

document.addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
  if(e.key=='Escape'){e.target.blur();closeModal()}
  return;
 }
 if(e.key=='Escape'){closeModal();return}
 const k=e.key;
 if(k=='/'){e.preventDefault();$('#q').focus()}
 else if(k=='r')rand();
 else if(k=='d'&&window.tg)tg();
 else if(k=='s'&&window.ts)ts();
 else if(k=='p'&&window.tp)tp();
 else if(k=='b')location.hash='#/bm';
 else if(k=='g')location.hash='#/stats';
 else if(k=='t')$('#th').click();
 else if(k=='?')shortcuts();
 else if(k=='j'||k=='k'){
  const a=document.querySelector('.nav a'+(k=='j'?'.pri':':not(.pri)'));
  if(a)location.href=a.href;
 }
});

/* Populate header icons */
$('#menu').innerHTML=ICO.menu;
$('#si').innerHTML=ICO.search;
$('#rnd').innerHTML=ICO.dice;
$('#bmlink').innerHTML=ICO.star;
$('#ks').innerHTML=ICO.kbd;
$('#th').innerHTML=ICO.theme;
$('#stats').innerHTML=ICO.chart;

/* ============ Boot ============ */
(async()=>{
 try{await load();route()}
 catch{
  M.innerHTML=`<div class=err>
   <h2>Couldn't load the repository</h2>
   <p class=mu>GitHub's API may be rate-limited (60 requests/hour per IP) or offline.</p>
   <p style="margin:12px 0"><button class="btn pri" onclick="location.reload()">${ICO.reset} Retry</button>
   <a class=btn style="text-decoration:none" target=_blank href="https://github.com/${OWNER}/${REPO}">${ICO.ext} Open repo</a></p>
  </div>`;
 }
})();
</script>
</body>
</html>
