<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeOrbit · Learn DSA in Python</title>
<style>
:root{--bg:#0a0d14;--p:#111623;--p2:#171e2f;--bd:#242d44;--tx:#e6eaf5;--mu:#8a94b0;--a:#00ffb4;--a2:#7c3aed;--ok:#22c55e;--wa:#f5b301;--er:#ef4444;--r:12px}
[data-t=light]{--bg:#f4f6fb;--p:#fff;--p2:#eef1f8;--bd:#d9dfec;--tx:#141a2b;--mu:#5d6784;--a:#0a9e75;--a2:#6d28d9}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--a)}button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--p) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:19px;text-decoration:none;color:var(--tx);white-space:nowrap}.brand b{color:var(--a)}
.btn{background:var(--p2);border:1px solid var(--bd);padding:7px 12px;border-radius:9px;transition:.15s}
.btn:hover{border-color:var(--a);transform:translateY(-1px)}.btn.pri{background:var(--a);color:#04140d;border-color:var(--a);font-weight:700}
.btn.on{border-color:var(--a);color:var(--a)}
#sw{position:relative;flex:1;max-width:460px;margin:0 auto}
#q{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--p2);color:var(--tx);outline:none}#q:focus{border-color:var(--a)}
#res{position:absolute;top:110%;left:0;right:0;background:var(--p);border:1px solid var(--bd);border-radius:10px;max-height:60vh;overflow:auto;display:none;box-shadow:0 12px 30px #0006}
#res a{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;color:var(--tx);text-decoration:none;border-bottom:1px solid var(--bd)}#res a:hover{background:var(--p2)}#res small{color:var(--mu)}
#menu{display:none}
.wrap{display:flex;min-height:calc(100vh - 57px)}
aside{width:270px;flex:none;border-right:1px solid var(--bd);padding:12px;overflow:auto;position:sticky;top:57px;height:calc(100vh - 57px);background:var(--p)}
aside details{margin-bottom:6px}aside summary{cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:6px 4px}
aside a{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px}
aside a:hover{background:var(--p2)}aside a.cur{background:var(--p2);color:var(--a);font-weight:600}aside a small{color:var(--mu)}
aside a.full small{color:var(--ok)}
main{flex:1;min-width:0;padding:24px clamp(14px,3vw,40px);max-width:1100px;margin:0 auto;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h1{font-size:clamp(24px,4vw,34px);margin-bottom:6px}h2{margin:22px 0 10px}
.mu{color:var(--mu)}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--p),var(--p2));border:1px solid var(--bd);border-radius:18px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(var(--a2),transparent 70%);opacity:.35}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--a) calc(var(--v)*1%),var(--bd) 0)}
.ring div{width:96px;height:96px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-weight:800;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;flex:1;min-width:260px;position:relative}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:12px}.stat b{display:block;font-size:24px;color:var(--a)}.stat span{font-size:12px;color:var(--mu)}
.card{background:var(--p);border:1px solid var(--bd);border-radius:var(--r);padding:14px;transition:.18s;text-decoration:none;color:var(--tx);display:block}
a.card:hover{border-color:var(--a);transform:translateY(-3px);box-shadow:0 8px 24px #0004}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--p);font-size:13px}.chip.on{background:var(--a);color:#04140d;border-color:var(--a);font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:6px}
.Easy{color:var(--ok);border-color:var(--ok)}.Medium{color:var(--wa);border-color:var(--wa)}.Hard{color:var(--er);border-color:var(--er)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--p);border:1px solid var(--bd);border-radius:var(--r);text-decoration:none;color:var(--tx);transition:.15s}
.row:hover{border-color:var(--a);transform:translateX(3px)}.row .n{font-family:ui-monospace,monospace;color:var(--mu);width:34px}.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .t{opacity:.55;text-decoration:line-through}.ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);display:grid;place-items:center;font-size:13px;flex:none}.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs{display:flex;gap:8px;margin:14px 0}
.body{background:var(--p);border:1px solid var(--bd);border-radius:var(--r);padding:8px 22px 18px;overflow:auto}
.body h1,.body h2,.body h3{margin:18px 0 8px}.body p,.body li{margin:6px 0}.body ul,.body ol{padding-left:24px}
.body code{background:var(--p2);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
.body table{border-collapse:collapse;margin:10px 0;display:block;overflow:auto}.body td,.body th{border:1px solid var(--bd);padding:6px 10px}
.body blockquote{border-left:3px solid var(--a);padding:2px 12px;color:var(--mu);margin:8px 0}
.cb{margin:12px 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#0b0f19}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#141b2b;color:#8a94b0;font-size:12px}
.cbh button{background:none;border:1px solid #2a3552;border-radius:6px;padding:2px 8px;color:#c7d0ea}
.cb pre{padding:12px 14px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#dfe6fb}.cb code{background:none!important;padding:0!important}
.k{color:#c792ea}.s{color:#a5e075}.n2{color:#f78c6c}.c{color:#6b7794;font-style:italic}.f{color:#82aaff}
.lock{text-align:center;padding:40px 10px}.lock p{margin:8px 0 16px;color:var(--mu)}
textarea{width:100%;min-height:90px;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0;flex-wrap:wrap}
.ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--a);color:#04140d;padding:9px 18px;border-radius:99px;font-weight:700;transition:.3s;z-index:50}#toast.s{transform:translate(-50%,0)}
.err{padding:30px;text-align:center;border:1px dashed var(--er);border-radius:var(--r)}
.load{padding:50px;text-align:center;color:var(--mu)}.load:before{content:"";display:block;width:34px;height:34px;margin:0 auto 12px;border:3px solid var(--bd);border-top-color:var(--a);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:820px){#menu{display:block}aside{position:fixed;left:0;top:57px;z-index:15;transform:translateX(-100%);transition:.25s;width:270px}aside.open{transform:none}.brand span{display:none}}
</style>
</head>
<body>
<header>
  <button class="btn" id="menu">☰</button>
  <a class="brand" href="#/">🛰️ Code<b>Orbit</b> <span class="mu" style="font-weight:400;font-size:12px">DSA in Python</span></a>
  <div id="sw"><input id="q" placeholder="Search topics & problems  ( press / )" autocomplete="off"><div id="res"></div></div>
  <button class="btn" id="rnd" title="Random problem (r)">🎲</button>
  <a class="btn" href="#/bm" title="Bookmarks">★</a>
  <button class="btn" id="th" title="Theme">🌓</button>
</header>
<div class="wrap"><aside id="side"></aside><main id="main"><div class="load">Loading the CodeOrbit library…</div></main></div>
<div id="toast"></div>

<script>
/* ===== CONFIG: change if you fork/rename the repo ===== */
const OWNER='mohdshamii',REPO='CodeOrbit',BRANCH='main';
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const CATS={
 'Core DSA':['Array_and_List','LinkedList','Stack_and_Queues','Trees','Heaps','Heap','Sorting_and_Searching','Sorting_and_Aearching','Matrix','String','Hash','SlidingWindow','TwoPointer','Recursion','BackStracking','DynamicProgramming','Graphs','GreedyAlgorithm','BitManipulation','Divide_and_Conquer','Matchematical_problem','GeomatricalProblem'],
 'Advanced':['Advanced_DataStructure','Advanced_String','Advanced_Mathematics','Advanced_Problems','Competative_programming'],
 'Programming':['OOP','Advanced_PythonConcept','FunctionalProgramming','Basics','Concurrency_and_Multithreading'],
 'Core CS':['SystemDesign','Databases','Networking','Security','Testing_and_debugging'],
 'Data & Dev':['DataScience','MachineLearning','WebDevelopment','GameDevelopement'],
 'Real World':['RealWorldApplication','RealWorldProblem','Miscellaneous']};
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=Object.assign({done:{},bm:{},notes:{},days:[],recent:[],theme:'dark'},ls.get('co_state',{}));
const save=()=>ls.set('co_state',S);
let topics=[],titles=ls.get('co_titles',{}),C={},timer=null;
document.documentElement.dataset.t=S.theme;
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',1800)};
const pretty=d=>d.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace('Aearching','Searching').replace('BackStracking','Backtracking').replace('Competative','Competitive').replace('Geomatrical','Geometrical').replace('Matchematical','Mathematical').replace('Developement','Development');
const cat=d=>Object.keys(CATS).find(c=>CATS[c].includes(d))||'More';
const pad=n=>String(n).padStart(2,'0');

/* ===== Markdown + Python highlight ===== */
const KW=/^(def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|with|try|except|finally|raise|yield|lambda|pass|break|continue|None|True|False|self|global|nonlocal|assert|del|async|await)$/;
function hl(c){let o='',l=0,m,p='';const R=/(#.*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)/g;
 while(m=R.exec(c)){o+=esc(c.slice(l,m.index));l=R.lastIndex;
  o+=m[1]?`<span class=c>${esc(m[1])}</span>`:m[2]?`<span class=s>${esc(m[2])}</span>`:m[3]?`<span class=n2>${m[3]}</span>`:KW.test(m[4])?`<span class=k>${m[4]}</span>`:(/^\s*\(/.test(c.slice(l,l+3))&&p!='.'?`<span class=f>${m[4]}</span>`:m[4]);p=m[0]}
 return o+esc(c.slice(l))}
const cb=(c,l)=>`<div class=cb><div class=cbh><span>${l||'code'}</span><button data-copy>Copy</button></div><pre><code>${hl(c.replace(/\n$/,''))}</code></pre></div>`;
function md(src){const B=[];src=src.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>(B.push(cb(c,l)),'\0'+(B.length-1)+'\0'));src=esc(src);
 const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target=_blank rel=noopener>$1</a>');
 const L=src.split('\n');let o='',ls_=null,P=[];const fp=()=>{if(P.length)o+='<p>'+inl(P.join(' '))+'</p>',P=[]},fl=()=>{if(ls_)o+='</'+ls_+'>',ls_=null};
 for(let i=0;i<L.length;i++){const l=L[i];let m;
  if(m=l.match(/^\0(\d+)\0$/)){fp();fl();o+=B[m[1]]}
  else if(m=l.match(/^(#{1,6})\s+(.*)/)){fp();fl();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if(/^\s*\|.*\|\s*$/.test(l)){fp();fl();let r=[];while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))r.push(L[i++]);i--;
   o+='<table>'+r.filter(x=>!/^[\s|:-]+$/.test(x)).map((x,j)=>'<tr>'+x.trim().replace(/^\||\|$/g,'').split('|').map(c=>`<t${j?'d':'h'}>${inl(c.trim())}</t${j?'d':'h'}>`).join('')+'</tr>').join('')+'</table>'}
  else if(m=l.match(/^\s*([-*]|\d+\.)\s+(.*)/)){fp();const t=/\d/.test(m[1])?'ol':'ul';if(ls_!=t)fl(),o+='<'+t+'>',ls_=t;o+='<li>'+inl(m[2])+'</li>'}
  else if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){fp();fl();o+='<hr>'}
  else if(m=l.match(/^&gt;\s?(.*)/)){fp();fl();o+='<blockquote>'+inl(m[1])+'</blockquote>'}
  else if(!l.trim()){fp();fl()}else P.push(l.trim())}
 fp();fl();return o}
const render=(txt,path)=>/\.py$/.test(path)?cb(txt,'python'):md(txt);

/* ===== Data: whole repo tree in ONE API call, cached 6h ===== */
async function load(){
 let c=ls.get('co_tree',null),tree;
 if(c&&Date.now()-c.t<216e5)tree=c.d;
 else try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);if(!r.ok)throw 0;
  tree=(await r.json()).tree.filter(x=>x.type=='blob'&&x.path.includes('/')&&!x.path.startsWith('.')&&/\.(md|py|txt)$/.test(x.path)).map(x=>x.path);ls.set('co_tree',{t:Date.now(),d:tree})}
 catch{if(c)tree=c.d;else throw 0}
 const map={};
 for(const p of tree){const parts=p.split('/'),d=parts[0],f=parts.at(-1),base=f.replace(/\.\w+$/,'');
  const isSol=/solution/i.test(p);const m=base.match(/(\d+)(?!.*\d)/);const key=m?String(+m[1]):base.replace(/solution|problem|[_-]/gi,'').toLowerCase()||base;
  const T=map[d]??={dir:d,name:pretty(d),cat:cat(d),m:{}};const it=T.m[key]??={key,n:m?+m[1]:0};
  if(isSol)it.sol=p;else it.prob=p}
 topics=Object.values(map).map(t=>({...t,items:Object.values(t.m).sort((a,b)=>a.n-b.n||a.key.localeCompare(b.key))})).filter(t=>t.items.length);
 const order=Object.values(CATS).flat();topics.sort((a,b)=>{const x=order.indexOf(a.dir),y=order.indexOf(b.dir);return(x<0?99:x)-(y<0?99:y)})}
async function get(p){if(!p)return null;if(C[p])return C[p];const r=await fetch(RAW+encodeURI(p));if(!r.ok)throw 0;return C[p]=await r.text()}
const id=(t,i)=>t.dir+'/'+i.key,all=()=>topics.flatMap(t=>t.items.map(i=>({t,i,id:id(t,i)})));
const doneIn=t=>t.items.filter(i=>S.done[id(t,i)]).length;
const today=()=>new Date().toISOString().slice(0,10);
function streak(){let s=0,d=new Date();const set=new Set(S.days);if(!set.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(set.has(d.toISOString().slice(0,10))){s++;d.setDate(d.getDate()-1)}return s}
const hash=(t,i)=>`#/p/${encodeURIComponent(t.dir)}/${encodeURIComponent(i.key)}`;
const diffOf=x=>(x.match(/\b(Easy|Medium|Hard)\b/i)||[])[1]?.replace(/^./,c=>c.toUpperCase());

/* ===== Sidebar ===== */
function side(cur){const g={};topics.forEach(t=>(g[t.cat]??=[]).push(t));
 $('#side').innerHTML=Object.entries(g).map(([c,ts])=>`<details ${ts.some(t=>t.dir==cur)||c=='Core DSA'?'open':''}><summary>${c}</summary>${ts.map(t=>{const d=doneIn(t);return`<a href="#/t/${encodeURIComponent(t.dir)}" class="${t.dir==cur?'cur':''} ${d==t.items.length?'full':''}"><span>${t.name}</span><small>${d}/${t.items.length}</small></a>`}).join('')}</details>`).join('')}

/* ===== Views ===== */
function home(){const A=all(),D=A.filter(x=>S.done[x.id]).length,pc=A.length?Math.round(D/A.length*100):0;
 const dc=A[Math.floor(Date.now()/864e5)%A.length];
 const cats=['All',...new Set(topics.map(t=>t.cat))];
 M.innerHTML=`<div class=hero><div class=ring style="--v:${pc}"><div>${pc}%</div></div><div style="flex:1;min-width:220px;position:relative"><h1>Welcome to CodeOrbit 🛰️</h1><p class=mu>Learn data structures & algorithms in Python — read the problem, try it yourself, then reveal the solution.</p><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="cont">▶ Continue</button><button class=btn id="rnd2">🎲 Random</button></div></div>
 <div class=stats><div class=stat><b>${A.length}</b><span>Problems</span></div><div class=stat><b>${topics.length}</b><span>Topics</span></div><div class=stat><b>${D}</b><span>Solved</span></div><div class=stat><b>🔥 ${streak()}</b><span>Day streak</span></div></div></div>
 ${dc?`<a class=card href="${hash(dc.t,dc.i)}" style="margin-bottom:8px;border-color:var(--a2)"><span class=mu>📅 Daily challenge</span><h3>${dc.t.name} · #${pad(dc.i.n)}</h3><span class=mu>${titles[dc.id]||'Open today\'s problem →'}</span></a>`:''}
 <h2>Topics</h2><div class=chips id=chips>${cats.map((c,i)=>`<button class="chip ${i?'':'on'}" data-c="${c}">${c}</button>`).join('')}</div><div class=grid id=tg></div>
 <h2>Your progress data</h2><div class=card><p class=mu style="margin-bottom:10px">Saved in this browser. Export to back up or move devices.</p><button class=btn id=ex>⬇ Export</button> <button class=btn id=im>⬆ Import</button> <button class=btn id=rs style="color:var(--er)">Reset</button><input type=file id=fi hidden accept=.json></div>`;
 const tg=(f)=>$('#tg').innerHTML=topics.filter(t=>f=='All'||t.cat==f).map(t=>{const d=doneIn(t);return`<a class=card href="#/t/${encodeURIComponent(t.dir)}"><small class=mu>${t.cat}</small><h3>${t.name}</h3><span class=mu>${d} / ${t.items.length} solved</span><div class=bar><i style="width:${d/t.items.length*100}%"></i></div></a>`}).join('');
 tg('All');
 $('#chips').onclick=e=>{const c=e.target.dataset.c;if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==e.target));tg(c)};
 $('#rnd2').onclick=rand;$('#cont').onclick=()=>{const r=S.recent[0];if(r){location.hash='#/p/'+r.split('/').map(encodeURIComponent).join('/')}else{const u=A.find(x=>!S.done[x.id])||A[0];location.hash=hash(u.t,u.i)}};
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='codeorbit-progress.json';a.click()};
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=async e=>{try{S=Object.assign(S,JSON.parse(await e.target.files[0].text()));save();toast('Imported ✔');route()}catch{toast('Invalid file')}};
 $('#rs').onclick=()=>{if(confirm('Erase all progress, bookmarks & notes?')){S={done:{},bm:{},notes:{},days:[],recent:[],theme:S.theme};save();route()}}}

function topicView(d){const t=topics.find(x=>x.dir==d);if(!t)return home();const dn=doneIn(t);
 M.innerHTML=`<a href="#/" class=mu>← All topics</a><div class=ph><div><h1>${t.name}</h1><span class=mu>${t.cat} · ${dn}/${t.items.length} solved</span></div><div><select id=fl class=btn><option value=all>All</option><option value=todo>Unsolved</option><option value=done>Solved</option><option value=bm>Bookmarked</option></select></div></div><div class=bar style="margin:12px 0 18px"><i style="width:${dn/t.items.length*100}%"></i></div><div class=list id=ls></div>`;
 const draw=()=>{const f=$('#fl').value;$('#ls').innerHTML=t.items.filter(i=>{const k=id(t,i);return f=='all'||(f=='todo'&&!S.done[k])||(f=='done'&&S.done[k])||(f=='bm'&&S.bm[k])}).map(i=>{const k=id(t,i);const ti=titles[k];return`<a class="row ${S.done[k]?'done':''}" href="${hash(t,i)}" data-k="${k}"><span class=ck>${S.done[k]?'✓':''}</span><span class=n>${pad(i.n)}</span><span class=t>${ti?esc(ti.t):'Problem '+pad(i.n)}</span>${ti&&ti.d?`<span class="tag ${ti.d}">${ti.d}</span>`:''}${S.bm[k]?'<span>★</span>':''}</a>`}).join('')||'<p class=mu>Nothing here yet.</p>'};
 $('#fl').onchange=draw;draw();
 (async()=>{let ch=0;await Promise.all(t.items.filter(i=>i.prob&&!titles[id(t,i)]).map(async i=>{try{const x=await get(i.prob);const h=x.match(/^#+\s*(.+)/m);titles[id(t,i)]={t:(h?h[1]:'Problem '+pad(i.n)).replace(/\*|`/g,'').slice(0,90),d:diffOf(x.slice(0,900))};ch=1}catch{}}));if(ch){ls.set('co_titles',titles);if(location.hash.startsWith('#/t/'))draw()}})()}

async function probView(d,k){const t=topics.find(x=>x.dir==d),ix=t?t.items.findIndex(x=>x.key==k):-1;if(ix<0)return home();
 const it=t.items[ix],K=id(t,it),pv=t.items[ix-1],nx=t.items[ix+1];
 S.recent=[K,...S.recent.filter(x=>x!=K)].slice(0,8);save();let shown=false,tab='p',sec=0;
 M.innerHTML=`<a href="#/t/${encodeURIComponent(d)}" class=mu>← ${t.name}</a><div class=ph><div><h1 id=ti>${(titles[K]||{}).t||'Problem '+pad(it.n)}</h1><span class=mu>${t.name} · #${pad(it.n)} · ⏱ <b id=tm>00:00</b></span></div>
 <div><button class=btn id=bk></button> <button class=btn id=dn></button></div></div>
 <div class=tabs><button class="btn on" id=t1>📖 Problem</button><button class=btn id=t2>💡 Solution</button><a class=btn style="text-decoration:none" target=_blank rel=noopener href="https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encodeURI(it.prob||it.sol)}">GitHub ↗</a></div>
 <div class=body id=bd><div class=load>Loading…</div></div>
 <h2>📝 My notes</h2><textarea id=nt placeholder="Write your approach, edge cases, complexity…">${esc(S.notes[K]||'')}</textarea>
 <div class=nav>${pv?`<a class=btn href="${hash(t,pv)}" style="text-decoration:none">← Previous</a>`:'<span></span>'}${nx?`<a class="btn pri" href="${hash(t,nx)}" style="text-decoration:none">Next →</a>`:'<span></span>'}</div>`;
 const st=()=>{$('#bk').textContent=S.bm[K]?'★ Bookmarked':'☆ Bookmark';$('#bk').classList.toggle('on',!!S.bm[K]);$('#dn').textContent=S.done[K]?'✓ Solved':'Mark solved';$('#dn').classList.toggle('pri',!!S.done[K])};st();
 window.tg=()=>{$('#dn').click()};window.ts=()=>{$('#t2').click()};
 $('#bk').onclick=()=>{S.bm[K]?delete S.bm[K]:S.bm[K]=1;save();st()};
 $('#dn').onclick=()=>{if(S.done[K])delete S.done[K];else{S.done[K]=1;if(!S.days.includes(today()))S.days.push(today());toast('Nice! 🎉 Problem solved')}save();st();side(d)};
 $('#nt').oninput=e=>{S.notes[K]=e.target.value;save()};
 clearInterval(timer);timer=setInterval(()=>{sec++;const e=$('#tm');if(e)e.textContent=pad(sec/60|0)+':'+pad(sec%60)},1e3);
 const show=async()=>{const b=$('#bd');$('#t1').classList.toggle('on',tab=='p');$('#t2').classList.toggle('on',tab=='s');
  try{if(tab=='p'){const p=it.prob||it.sol;const x=await get(p);b.innerHTML=render(x,p);const h=x.match(/^#+\s*(.+)/m);if(h&&!titles[K]){titles[K]={t:h[1].replace(/\*|`/g,''),d:diffOf(x.slice(0,900))};ls.set('co_titles',titles);$('#ti').textContent=titles[K].t}}
   else if(!it.sol)b.innerHTML='<div class=lock><p>No separate solution file found for this problem.</p></div>';
   else if(!shown)b.innerHTML='<div class=lock><h2>🔒 Try it yourself first</h2><p>Spend at least a few minutes thinking — struggling is how you learn.</p><button class="btn pri" id=rv>Reveal solution</button></div>',$('#rv').onclick=()=>{shown=true;show()};
   else b.innerHTML=render(await get(it.sol),it.sol)}
  catch{b.innerHTML=`<div class=err>Couldn't load this file.<br><a href="https://github.com/${OWNER}/${REPO}" target=_blank>Open the repo</a></div>`}};
 $('#t1').onclick=()=>{tab='p';show()};$('#t2').onclick=()=>{tab='s';show()};show()}

function bmView(){const B=all().filter(x=>S.bm[x.id]),R=S.recent.map(r=>all().find(x=>x.id==r)).filter(Boolean);
 const row=x=>`<a class="row ${S.done[x.id]?'done':''}" href="${hash(x.t,x.i)}"><span class=ck>${S.done[x.id]?'✓':''}</span><span class=n>${pad(x.i.n)}</span><span class=t>${x.t.name} — ${(titles[x.id]||{}).t||'Problem '+pad(x.i.n)}</span></a>`;
 M.innerHTML=`<h1>★ Bookmarks</h1><div class=list>${B.map(row).join('')||'<p class=mu>Nothing bookmarked yet.</p>'}</div><h2>🕘 Recently viewed</h2><div class=list>${R.map(row).join('')||'<p class=mu>Nothing yet.</p>'}</div>`}

function rand(){const A=all(),U=A.filter(x=>!S.done[x.id]),P=U.length?U:A,x=P[Math.random()*P.length|0];location.hash=hash(x.t,x.i)}

/* ===== Router & events ===== */
function route(){clearInterval(timer);window.tg=window.ts=null;const h=location.hash.slice(2).split('/').map(decodeURIComponent);
 side(h[0]=='t'||h[0]=='p'?h[1]:'');
 ({t:()=>topicView(h[1]),p:()=>probView(h[1],h[2]),bm:bmView}[h[0]]||home)();
 scrollTo(0,0);$('#side').classList.remove('open')}
addEventListener('hashchange',route);
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#th').onclick=()=>{S.theme=S.theme=='dark'?'light':'dark';document.documentElement.dataset.t=S.theme;save()};
$('#rnd').onclick=rand;
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){navigator.clipboard.writeText(b.closest('.cb').querySelector('pre').textContent);b.textContent='Copied ✔';setTimeout(()=>b.textContent='Copy',1200)}if(!e.target.closest('#sw'))$('#res').style.display='none'});
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase(),r=$('#res');if(!v){r.style.display='none';return}
 const tr=topics.filter(t=>t.name.toLowerCase().includes(v)).slice(0,5).map(t=>`<a href="#/t/${encodeURIComponent(t.dir)}"><span>📂 ${t.name}</span><small>${t.items.length} problems</small></a>`);
 const pr=all().filter(x=>((titles[x.id]||{}).t||'').toLowerCase().includes(v)||(x.t.name+' '+x.i.n).toLowerCase().includes(v)).slice(0,10).map(x=>`<a href="${hash(x.t,x.i)}"><span>${(titles[x.id]||{}).t||'Problem '+pad(x.i.n)}</span><small>${x.t.name}</small></a>`);
 r.innerHTML=[...tr,...pr].join('')||'<a><span class=mu>No matches (titles load as you browse topics)</span></a>';r.style.display='block'};
$('#q').onkeydown=e=>{if(e.key=='Enter'){const a=$('#res a');if(a&&a.href){location.href=a.href;$('#res').style.display='none';e.target.blur()}}};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key=='Escape')e.target.blur();return}
 const k=e.key;if(k=='/'){e.preventDefault();$('#q').focus()}else if(k=='r')rand();else if(k=='d'&&window.tg)tg();else if(k=='s'&&window.ts)ts();
 else if(k=='j'||k=='k'){const a=document.querySelector('.nav a'+(k=='j'?'.pri':':not(.pri)'));if(a)location.href=a.href}});

(async()=>{try{await load();route()}catch{M.innerHTML=`<div class=err><h2>Couldn't load the repository</h2><p class=mu>GitHub's API may be rate-limited (60 requests/hour per IP) or offline.</p><p style="margin:12px 0"><button class="btn pri" onclick="location.reload()">Retry</button> <a class=btn style="text-decoration:none" target=_blank href="https://github.com/${OWNER}/${REPO}">Open repo</a></p></div>`}})();
</script>
</body>
</html>
